name: update-snapshot
on:
  workflow_dispatch:
    inputs:
      build-command:
        description: 'Command to run to build the project'
        required: true
        default: 'pnpm build'
      update-snapshot-command:
        description: 'Command to run to update the snapshot'
        required: true
        default: 'pnpm test -- -u'
jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_PATH: "~/.cache/ms-playwright"
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Install playwright browsers
        uses: repobuddy/.github/.github/actions/setup-playwright@v2

      - run: ${{ inputs.build-command }}
      - run: ${{ inputs.update-snapshot-command }}

      - name: Archive snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots
          path: |
            */*/__vis__/**/__diffs__
            */*/__vis__/**/__results__

      - name: Create Pull Request
        uses: repobuddy/vis-bot@v0.1.0
        with:
          commit-message: "test: update snapshot"
          pr-title: "test: update snapshot"
          pr-body: "This PR updates the snapshot"
          target-branch: vis-bot/update-snapshot/${{ github.head_ref || github.ref_name }}
          base-branch: ${{ github.head_ref || github.ref_name }}
          paths-to-add: "*/*/__vis__/linux"
