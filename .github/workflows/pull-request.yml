name: pull-request
permissions:
  contents: read
  pull-requests: write
on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '**/__vis__/**/__baselines__/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to run against'
        required: true
        type: number
jobs:
  verify:
    strategy:
      # Every leg must finish: the lts/* legs open the snapshot PRs even after another leg fails.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node-version:
          - lts/-1
          - lts/*
    runs-on: ${{ matrix.os }}
    # vis-bot pushes the snapshot branch and opens the PR with github.token.
    permissions:
      contents: write
      pull-requests: write
    env:
      PLAYWRIGHT_PATH: ${{ matrix.os == 'windows-latest' && 'C:\\Users\\runneradmin\\AppData\\Local\\ms-playwright' || '~/.cache/ms-playwright' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}
      - name: Get PR head ref
        id: pr-info
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "head_ref=$(gh pr view ${{ inputs.pr_number }} --json headRefName -q .headRefName)" >> $GITHUB_OUTPUT
      - uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Install playwright browsers
        uses: repobuddy/.github/.github/actions/setup-playwright@v2

      - name: Verify
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: pnpm verify:ci
      - run: git add .
      - name: Classify head branch
        id: branch
        shell: bash
        env:
          HEAD_REF: ${{ steps.pr-info.outputs.head_ref || github.head_ref }}
        run: |
          echo "name=$HEAD_REF" >> "$GITHUB_OUTPUT"
          # Renovate and Dependabot PRs can merge themselves, so a render change on them must fail the check.
          if [[ "$HEAD_REF" == renovate* || "$HEAD_REF" == dependabot* ]]; then
            echo "dependency_bot=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect snapshot changes
        uses: dorny/paths-filter@v4
        id: snapshot-changes
        with:
          base: HEAD
          list-files: shell
          filters: |
            snapshots:
              - '*/*/__vis__/**/__baselines__/**'

      # Fork and Dependabot PRs get a read-only github.token, so they cannot open the snapshot PR.
      - name: Create Pull Request
        id: snapshot-pr
        if: matrix.node-version == 'lts/*' && steps.snapshot-changes.outputs.snapshots == 'true' && !startsWith(steps.branch.outputs.name, 'vis-bot') && !startsWith(steps.branch.outputs.name, 'dependabot')
        uses: repobuddy/vis-bot@d5f3990399426c4468028062d440a44eeb7ee9ed
        with:
          commit-message: "test(${{ matrix.os }}/lts-latest): update snapshot"
          pr-title: "test(${{ matrix.os }}/lts-latest): update snapshot"
          pr-body: "This PR updates the snapshot for ${{ matrix.os }} node lts-latest"
          target-branch: vis-bot/update-snapshot/${{ steps.branch.outputs.name }}-${{ matrix.os }}-lts-latest
          base-branch: ${{ steps.branch.outputs.name }}
          paths-to-add: "*/*/__vis__/${{ matrix.os == 'windows-latest' && 'win32' || 'linux' }}"

      - name: Collect changed baselines
        if: steps.branch.outputs.dependency_bot == 'true' && steps.snapshot-changes.outputs.snapshots == 'true'
        shell: bash
        env:
          CHANGED: ${{ steps.snapshot-changes.outputs.snapshots_files }}
        run: |
          mkdir -p .vis-changed-baselines
          eval "set -- $CHANGED"
          for f in "$@"; do
            [[ -f "$f" ]] && cp --parents "$f" .vis-changed-baselines/
          done
      - name: Upload changed baselines
        if: steps.branch.outputs.dependency_bot == 'true' && steps.snapshot-changes.outputs.snapshots == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: changed-baselines-${{ matrix.os }}-${{ strategy.job-index }}
          path: .vis-changed-baselines
          include-hidden-files: true

      - name: Fail on render change in a dependency PR
        if: steps.branch.outputs.dependency_bot == 'true' && steps.snapshot-changes.outputs.snapshots == 'true'
        shell: bash
        env:
          CHANGED: ${{ steps.snapshot-changes.outputs.snapshots_files }}
          SNAPSHOT_PR_NUMBER: ${{ steps.snapshot-pr.outputs.pr-number }}
        run: |
          eval "set -- $CHANGED"
          if [[ -n "$SNAPSHOT_PR_NUMBER" ]]; then
            review="Review the new render in ${{ github.server_url }}/${{ github.repository }}/pull/$SNAPSHOT_PR_NUMBER. Merge it into this branch if the change is intended; otherwise fix the regression."
          else
            review="Download the changed-baselines artifact from this run to review the new render, or see the snapshot PR from the lts/* job."
          fi
          echo "::error title=Render changed::This dependency update changes $# snapshot(s). $review"
          {
            echo "## Render changed"
            echo
            echo "This dependency update changes $# snapshot(s), so it must not merge without review."
            echo
            echo "$review"
            echo
            for f in "$@"; do echo "- \`$f\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  all-checks:
    needs: [verify]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All checks passed
        run: |
          if [[ "${{ needs.verify.result }}" != "success" ]]; then
            exit 1
          fi
