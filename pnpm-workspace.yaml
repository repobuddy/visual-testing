packages:
  - packages/*
  - testcases/*

# Supply-chain soak. Set here (not in .npmrc) because pnpm only enables strict
# enforcement when the setting comes from pnpm-workspace.yaml / config.yaml /
# CLI / env; from .npmrc it runs loose and silently waives too-young packages
# into minimumReleaseAgeExclude instead of failing.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  # type-plus@8.0.0-beta.10 fixes the CJS packaging defect in beta.8 that broke
  # require() of these packages. Taken before the 24h soak elapses; it is a
  # first-party dependency published via npm trusted publishing with SLSA
  # provenance (verified).
  - 'type-plus@8.0.0-beta.10'
  # Required by type-plus@8.0.0-beta.10 (tersify ^4.0.6, unpartial ^1.0.7); no
  # older version satisfies those ranges. Both are first-party and published
  # with SLSA provenance (verified).
  - 'tersify@4.0.6'
  - 'unpartial@1.0.7'

allowBuilds:
  '@parcel/watcher': true
  edgedriver: true
  esbuild: true
  fsevents: true
  geckodriver: true

overrides:
  # deepmerge-ts <8 is vulnerable; @wdio/config still asks for ^7.
  'deepmerge-ts@<8': '^8'

catalog:
  '@repobuddy/vitest': ^2.1.2
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.5
  '@vitejs/plugin-react': ^6.1.0
  '@vitest/browser': ^5.0.0
  '@vitest/browser-playwright': ^5.0.0
  '@vitest/browser-webdriverio': ^4.1.11
  '@vitest/coverage-istanbul': ^5.0.0
  '@vitest/coverage-v8': ^5.0.0
  '@vitest/expect': ^5.0.0
  '@vitest/ui': ^5.0.0
  typescript: ^6.0.3
  vite: ^8.2.2
  vitest: ^5.0.0
  vitest-browser-react: ^2.2.0

ignoredBuiltDependencies:
  - edgedriver
  - geckodriver
  - msw
