packages:
  - packages/*
  - testcases/*

allowBuilds:
  '@parcel/watcher': true
  edgedriver: true
  esbuild: true
  fsevents: true
  geckodriver: true

overrides:
  # deepmerge-ts <8 is vulnerable; @wdio/config still asks for ^7.
  'deepmerge-ts@<8': '^8'

catalog:
  '@repobuddy/vitest': ^2.1.2
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.5
  '@vitejs/plugin-react': ^6.1.0
  '@vitest/browser': ^4.1.11
  '@vitest/browser-playwright': ^4.1.11
  '@vitest/browser-webdriverio': ^4.1.11
  '@vitest/coverage-istanbul': ^4.1.11
  '@vitest/coverage-v8': ^4.1.11
  '@vitest/expect': ^4.1.11
  '@vitest/ui': ^4.1.11
  typescript: ^6.0.3
  vite: ^8.2.2
  vitest: ^4.1.11
  vitest-browser-react: ^2.2.0

ignoredBuiltDependencies:
  - edgedriver
  - geckodriver
  - msw
