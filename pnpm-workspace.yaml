packages:
  - packages/*
  - testcases/*

# Supply-chain soak. Set here (not in .npmrc) because pnpm only enables strict
# enforcement when the setting comes from pnpm-workspace.yaml / config.yaml /
# CLI / env; from .npmrc it runs loose and silently waives too-young packages
# into minimumReleaseAgeExclude instead of failing.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

allowBuilds:
  '@parcel/watcher': true
  edgedriver: true
  esbuild: true
  fsevents: true
  geckodriver: true

overrides:
  # deepmerge-ts <8 is vulnerable; @wdio/config still asks for ^7.
  'deepmerge-ts@<8': '^8'

catalog:
  '@repobuddy/vitest': ^2.1.2
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.5
  '@vitejs/plugin-react': ^6.1.0
  '@vitest/browser': ^5.0.0
  '@vitest/browser-playwright': ^5.0.0
  '@vitest/browser-webdriverio': ^4.1.11
  '@vitest/coverage-istanbul': ^5.0.0
  '@vitest/coverage-v8': ^5.0.0
  '@vitest/expect': ^5.0.0
  '@vitest/ui': ^5.0.0
  typescript: ^6.0.3
  vite: ^8.2.2
  vitest: ^5.0.0
  vitest-browser-react: ^2.2.0

ignoredBuiltDependencies:
  - edgedriver
  - geckodriver
  - msw

# First-party packages are exempt from the soak.
#
# The soak exists to stop a COMPROMISED THIRD-PARTY release being pulled into a build
# within hours of publication. It does not describe our own packages: we control what
# goes into them, and a first-party release is reviewed before it is published, not
# after. Applying it to ourselves only means a fresh publish is invisible to the next
# repo in the chain for 24h.
minimumReleaseAgeExclude:
  - assertron
  - satisfier
  - tersify
  - unpartial
  - type-plus
  - path-equal
  - iso-error
  - iso-error-web
  - iso-error-google-cloud-api
  - google-cloud-api
  - standard-log
  - standard-log-color
  - async-fp
  - fsa-emitter
  - progress-str
  - clibuilder
  - args-minus
  - global-store
  - stable-store
  - mocktomata
  - just-func
  - storybook-addon-vis
  - vitest-plugin-vis
  - node-supported-releases
  - '@just-func/*'
  - '@just-web/*'
  - '@mocktomata/*'
  - '@repobuddy/*'
  - '@unional/*'
